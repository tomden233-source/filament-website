<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FilamentHub – 3D-Druck Filament-Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 850: '#162032', 925: '#0b111e' } } } } };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0b111e; color: #f1f5f9; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
    @keyframes pulse-border { 0%, 100% { border-color: rgba(239, 68, 68, 0.85); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.25); } 50% { border-color: rgba(239, 68, 68, 0.3); box-shadow: 0 0 18px 2px rgba(239, 68, 68, 0.2); } }
    .overdue-card { animation: pulse-border 2.2s infinite; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-orange-500 selection:text-white">

  <!-- TOP NAVBAR -->
  <header class="sticky top-0 z-30 backdrop-blur-xl bg-slate-900/85 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center shadow-lg shadow-orange-500/20">
          <i data-lucide="disc-3" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-extrabold tracking-tight text-white">FilamentHub</h1>
            <span class="text-[11px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">Cloud Storage Aktiv</span>
          </div>
          <p class="text-xs text-slate-400">Bestand, Druckverbrauch & fester Cloud-Speicher</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2.5">
        <button onclick="openHistoryModal()" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 transition">
          <i data-lucide="history" class="w-4 h-4 text-orange-400"></i>
          <span>Druck-Verlauf</span>
          <span id="historyBadge" class="px-1.5 py-0.5 text-[10px] rounded-full bg-slate-700 text-slate-300">0</span>
        </button>
        <button onclick="openSpoolModal()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white text-xs sm:text-sm font-bold shadow-lg shadow-orange-500/25 transition">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>Neue Spule</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- MAGIC LINK QUICK-IMPORT BAR -->
    <section class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-slate-900 via-slate-850 to-slate-900 border border-orange-500/30 p-4 sm:p-5 shadow-xl">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div class="space-y-1">
          <div class="inline-flex items-center gap-2 text-orange-400 text-xs font-bold uppercase tracking-wider">
            <i data-lucide="wand-2" class="w-4 h-4"></i>
            <span>Intelligenter Produkt-Link Scanner</span>
          </div>
          <h2 class="text-base sm:text-lg font-bold text-white">Filament-Link einfügen & Daten vorbefüllen</h2>
        </div>

        <div class="flex-1 max-w-2xl">
          <div class="flex flex-col sm:flex-row gap-2">
            <div class="relative flex-1">
              <i data-lucide="link" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input
                id="quickLinkInput"
                type="url"
                placeholder="https://eu.store.bambulab.com/products/..."
                class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-950/90 border border-slate-700 focus:border-orange-500 text-sm text-white outline-none"
                onkeydown="if(event.key==='Enter'){ handleQuickLinkImport(); }"
              />
            </div>
            <button onclick="handleQuickLinkImport()" class="px-5 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm transition">Daten laden</button>
          </div>
        </div>
      </div>
    </section>

    <!-- FILTER & SORT TOOLBAR -->
    <section class="rounded-2xl bg-slate-900/90 border border-slate-800 p-4 space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div id="materialFilterBar" class="flex items-center gap-1.5 overflow-x-auto pb-1"></div>
        <div class="flex flex-wrap items-center gap-2.5">
          <input id="searchInput" type="text" oninput="renderSpools()" placeholder="Marke, Farbe, Material..." class="w-full sm:w-56 px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none" />
          <select id="sortSelect" onchange="renderSpools()" class="px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs font-semibold text-slate-200 outline-none">
            <option value="drying_urgent">🔥 Trocknung (dringend zuerst)</option>
            <option value="material_asc">🧪 Material (A–Z)</option>
            <option value="remaining_asc">⚖️ Restgewicht (wenig zuerst)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- SPOOL GRID -->
    <section id="spoolGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"></section>

  </main>

  <!-- ADD / EDIT SPOOL MODAL -->
  <div id="spoolModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl my-8">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="modalTitle" class="text-lg font-bold text-white">Spule eintragen</h3>
        <button onclick="closeSpoolModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <div class="rounded-xl bg-slate-950/90 border border-orange-500/30 p-3 space-y-2">
        <label class="block text-xs font-bold text-orange-400 uppercase">Produkt-Link einfügen</label>
        <div class="flex gap-2">
          <input id="fProductUrl" type="url" placeholder="Shop-Link..." class="flex-1 px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white outline-none" />
          <button type="button" onclick="fetchFromModalUrl()" class="px-3 py-2 rounded-lg bg-orange-500 text-white text-xs font-bold">Laden</button>
        </div>
      </div>

      <form id="spoolForm" onsubmit="saveSpool(event)" class="space-y-3">
        <input type="hidden" id="fId" />
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Hersteller / Marke *</label>
          <select id="fBrandSelect" onchange="handleBrandDropdownChange()" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white outline-none mb-2">
            <option value="Bambu Lab">Bambu Lab</option>
            <option value="Prusament">Prusament</option>
            <option value="Extrudr">Extrudr</option>
            <option value="Polymaker">Polymaker</option>
            <option value="eSUN">eSUN</option>
            <option value="SUNLU">SUNLU</option>
            <option value="Das Filament">Das Filament</option>
            <option value="3DJake">3DJake</option>
            <option value="Overture">Overture</option>
            <option value="Creality">Creality</option>
            <option value="Elegoo">Elegoo</option>
            <option value="OTHER">➕ Anderer Hersteller / Manuell...</option>
          </select>
          <input id="fBrandCustom" type="text" placeholder="Hersteller-Name eingeben..." class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white outline-none hidden" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Bezeichnung / Serie *</label>
          <input id="fName" type="text" required placeholder="z.B. PLA Matte Charcoal" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Material</label>
            <select id="fMaterial" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white outline-none">
              <option value="PLA">PLA</option><option value="PLA+">PLA+</option><option value="PETG">PETG</option><option value="TPU">TPU</option><option value="ABS">ABS</option><option value="ASA">ASA</option><option value="PA / Nylon">PA / Nylon</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Farbe & Vorschau</label>
            <div class="flex items-center gap-2">
              <input id="fColorHex" type="color" value="#f97316" class="w-10 h-10 rounded-xl bg-slate-950 border border-slate-800 p-1 cursor-pointer" />
              <input id="fColorName" type="text" placeholder="Farbe..." class="flex-1 px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none" />
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Startgewicht (g)</label>
            <input id="fInitialWeight" type="number" value="1000" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm font-mono-num text-white outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Restgewicht (g)</label>
            <input id="fRemainingWeight" type="number" value="1000" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm font-mono-num text-emerald-400 font-bold outline-none" />
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeSpoolModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs text-slate-300">Abbrechen</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-orange-500 text-xs font-bold text-white">Spule speichern</button>
        </div>
      </form>
    </div>
  </div>

  <!-- HISTORY MODAL -->
  <div id="historyModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 space-y-3">
      <div class="flex justify-between items-center"><h3 class="text-base font-bold text-white">Druck-Verlauf</h3><button onclick="closeHistoryModal()" class="text-slate-400">✕</button></div>
      <div id="historyList" class="space-y-2 max-h-60 overflow-y-auto"></div>
    </div>
  </div>

  <script>
    const MATERIAL_PRESETS = {
      'PLA': { intervalDays: 30 }, 'PLA+': { intervalDays: 28 }, 'PETG': { intervalDays: 21 },
      'TPU': { intervalDays: 14 }, 'ABS': { intervalDays: 21 }, 'ASA': { intervalDays: 21 }, 'PA / Nylon': { intervalDays: 7 }
    };

    const BRAND_DATABASE = [
      { keys: ['bambulab', 'bambu'], name: 'Bambu Lab' },
      { keys: ['prusament', 'prusa'], name: 'Prusament' },
      { keys: ['extrudr'], name: 'Extrudr' },
      { keys: ['polymaker'], name: 'Polymaker' },
      { keys: ['esun'], name: 'eSUN' },
      { keys: ['sunlu'], name: 'SUNLU' },
      { keys: ['dasfilament'], name: 'Das Filament' },
      { keys: ['3djake'], name: '3DJake' }
    ];

    const COLOR_MAP = [
      { keys: ['charcoal', 'anthrazit', 'anthracite', 'dunkelgrau', 'galaxy-black'], name: 'Anthrazit / Charcoal', hex: '#27272a' },
      { keys: ['schwarz', 'black', 'jet-black', 'onyx'], name: 'Schwarz', hex: '#18181b' },
      { keys: ['weiss', 'weiß', 'white', 'cold-white', 'ivory', 'marble'], name: 'Weiß', hex: '#f8fafc' },
      { keys: ['orange', 'mandarin', 'pumpkin', 'amber'], name: 'Orange', hex: '#f97316' },
      { keys: ['rot', 'red', 'crimson', 'scarlet', 'ruby', 'magenta'], name: 'Rot', hex: '#ef4444' },
      { keys: ['blau', 'blue', 'navy', 'cobalt', 'cyan', 'türkis', 'turquoise', 'sky'], name: 'Blau', hex: '#3b82f6' },
      { keys: ['gruen', 'grün', 'green', 'olive', 'emerald', 'lime', 'mint', 'forest'], name: 'Grün', hex: '#22c55e' },
      { keys: ['gelb', 'yellow', 'lemon', 'sunflower'], name: 'Gelb', hex: '#eab308' },
      { keys: ['lila', 'purple', 'violet', 'violett', 'lavender', 'plum'], name: 'Lila / Violett', hex: '#a855f7' },
      { keys: ['pink', 'rosa', 'rose', 'peach'], name: 'Pink / Rosa', hex: '#ec4899' },
      { keys: ['gold', 'messing', 'brass', 'bronze', 'copper', 'kupfer'], name: 'Gold / Bronze', hex: '#d97706' },
      { keys: ['silber', 'silver', 'grau', 'grey', 'gray', 'titanium'], name: 'Silber / Grau', hex: '#94a3b8' },
      { keys: ['braun', 'brown', 'wood', 'holz', 'coffee', 'beige', 'sand'], name: 'Braun / Holz', hex: '#a16207' },
      { keys: ['transparent', 'clear', 'translucent', 'natur'], name: 'Transparent / Natur', hex: '#cbd5e1' }
    ];

    const STORAGE_KEY_SPOOLS = 'filamenthub_spools_v7';
    const STORAGE_KEY_HISTORY = 'filamenthub_history_v7';

    let spools = [];
    let printHistory = [];
    let activeMaterialFilter = 'ALL';

    const cloudDbUrl = 'https://api.npoint.io/2a75ad089c77e7c35f98';
    let isSyncing = false;

    async function loadStateFromCloud() {
      try {
        const res = await fetch(cloudDbUrl);
        const data = await res.json();
        if (data && Array.isArray(data.spools) && data.spools.length > 0) {
          spools = data.spools;
          printHistory = Array.isArray(data.printHistory) ? data.printHistory : [];
          localStorage.setItem(STORAGE_KEY_SPOOLS, JSON.stringify(spools));
          localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(printHistory));
          renderSpools();
          return;
        }
      } catch(e) {}

      const s = localStorage.getItem(STORAGE_KEY_SPOOLS);
      const h = localStorage.getItem(STORAGE_KEY_HISTORY);
      if (s) try { spools = JSON.parse(s); } catch(e){}
      if (h) try { printHistory = JSON.parse(h); } catch(e){}
      
      if (!spools.length) {
        spools = [{ id: 'sp-1', brand: 'Bambu Lab', name: 'PLA Matte Charcoal', material: 'PLA', colorName: 'Anthrazit', colorHex: '#27272a', initialWeight: 1000, remainingWeight: 750, lastDried: new Date().toISOString(), dryIntervalDays: 30 }];
        saveState();
      }
      renderSpools();
    }

    async function saveState() {
      localStorage.setItem(STORAGE_KEY_SPOOLS, JSON.stringify(spools));
      localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(printHistory));
      
      if (!isSyncing) {
        try {
          await fetch(cloudDbUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ updatedAt: Date.now(), spools, printHistory })
          });
        } catch(e) {}
      }
    }

    // Verbesserter Intelligenter Link- & Farb-Parser
    function parseFilamentData(urlStr, title = '') {
      const lower = `${urlStr}${title}`.toLowerCase();
      
      let detectedBrand = 'Bambu Lab';
      for (const b of BRAND_DATABASE) {
        if (b.keys.some(k => lower.includes(k))) { detectedBrand = b.name; break; }
      }

      let detectedMaterial = 'PLA';
      if (lower.includes('petg')) detectedMaterial = 'PETG';
      else if (lower.includes('tpu')) detectedMaterial = 'TPU';
      else if (lower.includes('abs')) detectedMaterial = 'ABS';
      else if (lower.includes('asa')) detectedMaterial = 'ASA';
      else if (lower.includes('nylon') || lower.includes('pa')) detectedMaterial = 'PA / Nylon';

      let detectedColorName = 'Standard';
      let detectedColorHex = '#f97316';
      for (const c of COLOR_MAP) {
        if (c.keys.some(k => lower.includes(k))) {
          detectedColorName = c.name;
          detectedColorHex = c.hex;
          break;
        }
      }

      let cleanName = title ? title.split('|')[0].replace(/-/g, ' ').trim() : `${detectedMaterial}${detectedColorName}`;

      return {
        brand: detectedBrand,
        material: detectedMaterial,
        name: cleanName,
        colorName: detectedColorName,
        colorHex: detectedColorHex,
        productUrl: urlStr
      };
    }

    async function extractMetadataFromUrl(urlStr) {
      try {
        const resp = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(urlStr)}`);
        const data = await resp.json();
        if (data && data.contents) {
          const doc = new DOMParser().parseFromString(data.contents, 'text/html');
          const title = doc.querySelector('title')?.textContent || '';
          return parseFilamentData(urlStr, title);
        }
      } catch(e){}
      return parseFilamentData(urlStr);
    }

    async function handleQuickLinkImport() {
      const input = document.getElementById('quickLinkInput');
      const urlStr = input.value.trim();
      if (!urlStr) return;
      const data = await extractMetadataFromUrl(urlStr);
      openSpoolModal(null, data);
      input.value = '';
    }

    async function fetchFromModalUrl() {
      const urlStr = document.getElementById('fProductUrl').value.trim();
      if (!urlStr) return;
      const data = await extractMetadataFromUrl(urlStr);
      populateModalFields(data);
    }

    function getDryingStatus(spool) {
      const lastDriedMs = new Date(spool.lastDried || Date.now()).getTime();
      const intervalMs = (Number(spool.dryIntervalDays) || 30) * 86400000;
      const dueTimeMs = lastDriedMs + intervalMs;
      const diffMs = dueTimeMs - Date.now();
      const isOverdue = diffMs <= 0;
      const absMs = Math.abs(diffMs);
      return {
        diffMs, isOverdue,
        days: Math.floor(absMs / 86400000),
        hours: Math.floor((absMs % 86400000) / 3600000)
      };
    }

    function renderSpools() {
      const bar = document.getElementById('materialFilterBar');
      const counts = { ALL: spools.length };
      spools.forEach(s => counts[s.material] = (counts[s.material] || 0) + 1);
      bar.innerHTML = ['ALL', 'PLA', 'PETG', 'TPU', 'ABS'].map(mat => `
        <button onclick="activeMaterialFilter='${mat}';renderSpools();" class="px-3 py-1.5 rounded-xl text-xs font-semibold border ${activeMaterialFilter===mat ? 'bg-orange-500 text-white border-orange-500' : 'bg-slate-950 text-slate-400 border-slate-800'}">${mat}</button>
      `).join('');

      const grid = document.getElementById('spoolGrid');
      let filtered = spools.filter(s => activeMaterialFilter === 'ALL' || s.material === activeMaterialFilter);
      
      grid.innerHTML = filtered.map(spool => {
        const pct = Math.max(0, Math.min(100, Math.round((spool.remainingWeight / spool.initialWeight) * 100)));
        const dry = getDryingStatus(spool);
        const hex = spool.colorHex || '#f97316';
        return `
          <div class="rounded-2xl bg-slate-900/95 border ${dry.isOverdue ? 'overdue-card border-rose-500/70' : 'border-slate-800'} p-5 space-y-3">
            <div class="flex justify-between items-start">
              <div class="flex items-center gap-3">
